[project]
name = "attestable-cli"
version = "0.1.0"
description = "Attestable — command-line wrapper around the detection engine (open core)."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["attestable-engine"]

# The `attestable` console script (F6): `attestable scan <target>`.
[project.scripts]
attestable = "attestable_cli.cli:_console"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestable_cli"]

[tool.uv.sources]
attestable-engine = { workspace = true }
