[project]
name = "provenire-cli"
version = "0.1.0"
description = "Provenire — command-line wrapper around the detection engine (open core)."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["provenire-engine"]

# The `provenire` console script (F6): `provenire scan <target>`.
[project.scripts]
provenire = "provenire_cli.cli:_console"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenire_cli"]

[tool.uv.sources]
provenire-engine = { workspace = true }
