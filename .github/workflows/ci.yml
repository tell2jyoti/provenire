name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync workspace
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check . && uv run mypy .
      - name: Full test suite (incl. integration against fixtures-servers/)
        run: uv run pytest -q
